name: Persona Carousel Publication ZIP Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'carousels-v*'
    branches:
      - main
    paths:
      - '.github/workflows/persona-publish-release.yml'
      - 'tools/persona-build-baseline-review.mjs'
  pull_request:
    paths:
      - 'tools/persona-build-publish-packages.mjs'
      - 'tools/persona-build-publish-packages.test.mjs'
      - '.github/workflows/persona-publish-release.yml'
      - 'config/author-approved-carousels.json'
      - 'apps/web/src/personaEditorialModel.ts'
      - 'apps/web/src/PersonaEditorialStudio.tsx'
      - 'apps/web/src/personaEditorialPublish.ts'
      - 'docs/how-to-publish-carousels.md'
      - 'tools/persona-build-baseline-review.mjs'
      - 'tools/persona-build-baseline-review.test.mjs'
      - 'docs/persona-baseline-v2-review.md'

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/carousels-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing app and Chromium tooling
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start local Vite for existing Canvas renderer
        run: |
          nohup npm run web:dev -- --host 127.0.0.1 --port 4173 > /tmp/persona-release-vite.log 2>&1 &
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/persona-release-vite.log
          exit 1
      - name: Test publication ZIP builder (synthetic approvals, not releasable)
        run: |
          node tools/persona-build-publish-packages.mjs --self-test
          node --test tools/persona-build-publish-packages.test.mjs
      - name: Build five chat-approved ZIPs and 24 standalone PNG previews
        if: github.event_name != 'pull_request'
        run: |
          test -s config/author-approved-carousels.json
          node tools/persona-build-publish-packages.mjs \
            --author-approvals config/author-approved-carousels.json \
            --output-dir dist/publish-packages
          test "$(find dist/publish-packages -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          test "$(find dist/publish-packages/previews -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 24
          node --test tools/persona-build-publish-packages-release.test.mjs
      - name: Publish 5 ZIP + 24 PNG to GitHub Release (never Instagram)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN: ${{ github.run_number }}
        run: |
          if [ "$RELEASE_EVENT" = "push" ] && [[ "$RELEASE_REF" == carousels-v* ]]; then
            TAG="$RELEASE_REF"
          elif gh release view carousels-v1 >/dev/null 2>&1; then
            TAG="carousels-v1-$(date -u +%Y%m%d)-$RELEASE_RUN"
          else
            TAG=carousels-v1
          fi
          if ! [[ "$TAG" =~ ^carousels-v[0-9][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::Invalid release tag" >&2
            exit 1
          fi
          export TAG
          node --input-type=module <<'NODE' > /tmp/persona-carousel-release-notes.md
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('dist/publish-packages/release-metadata.json','utf8'));
          if(m.testOnly||m.files.length!==5)throw Error('Only real reviewed packages can be released');
          console.log('# Persona Carousels v1 — четыре карусели для публикации\n');
          for(const p of m.carousels)
           console.log('- **'+p.title+'** — текст подтверждён автором в чате 20.11.2026; '+(p.textFallback?'текстовая версия':'с фото')+'.');
          console.log('\n**Важно:** автор пока не просмотрел визуальное оформление. Перед публикацией посмотрите все 24 PNG на телефоне.\n');
          console.log('PNG-файлы добавлены отдельно — их можно посмотреть на телефоне прямо в браузере. ZIP-архивы — готовые пакеты для публикации в Instagram.');
          console.log('\nПубликация в Instagram остаётся только ручной.\n');
          console.log('Инструкция: https://github.com/'+process.env.GITHUB_REPOSITORY+'/blob/main/docs/how-to-publish-carousels.md');
          console.log('Чек-лист: https://github.com/'+process.env.GITHUB_REPOSITORY+'/blob/main/docs/carousel-acceptance-checklist.md');
          NODE
          gh release create "$TAG" dist/publish-packages/*.zip dist/publish-packages/previews/*.png \
            --title "Persona Carousels v1 — четыре карусели для публикации" \
            --notes-file /tmp/persona-carousel-release-notes.md \
            --target "$GITHUB_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          RELEASE_JSON="$RELEASE_JSON" node --input-type=module <<'NODE'
          const d=JSON.parse(process.env.RELEASE_JSON||'{}');
          const {readFileSync}=await import('node:fs');
          const m=JSON.parse(readFileSync('dist/publish-packages/release-metadata.json','utf8'));
          const assets=d.assets??[],expected=[...m.files,...m.previewFiles].sort();
          if(m.testOnly||m.files.length!==5||m.previewFiles.length!==24)
           throw Error('Invalid publication manifest');
          const actual=assets.map(x=>x.name).sort();
          if(assets.length!==29||JSON.stringify(actual)!==JSON.stringify(expected)||
             assets.some(x=>x.size<1000||!x.browser_download_url))
           throw Error('Release must contain exactly five nonempty ZIP and 24 PNG assets');
          console.log('PERSONA_GITHUB_RELEASE_VERIFIED '+JSON.stringify({
           html_url:d.html_url,assets:assets.map(a=>({name:a.name,size:a.size,url:a.browser_download_url}))
          }));
          NODE

  baseline_review:
    name: Persona v2 Baseline Review Assets
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing deps and Chromium (local fontsource packages)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start original local Vite renderer
        run: |
          nohup npm run web:dev -- --host 127.0.0.1 --port 4173 > /tmp/persona-v2-vite.log 2>&1 &
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/persona-v2-vite.log
          exit 1
      - name: Build one review-only ZIP + six PNG + one contact sheet
        run: |
          node tools/persona-build-baseline-review.mjs
          node --test tools/persona-build-baseline-review.test.mjs
          test "$(find dist/baseline-review-v2 -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          test "$(find dist/baseline-review-v2 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 7
      - name: Publish new carousels-v2-baseline Release without touching v1
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          TAG=carousels-v2-baseline
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release v2 already exists. Refusing to overwrite a reviewed snapshot."
            exit 1
          fi
          cat > /tmp/persona-v2-notes.md <<'NOTES'
          # Persona Carousels v2 — артистический дизайн карусели №1

          **«Почему пауза сильнее реплики»**, шесть новых Canvas-слайдов 1080×1350: шоколад/графит, Playfair Display и Inter, сдержанное зерно и развитие типографики.

          **Оформление ждёт визуального подтверждения автора.** Текст подтверждён в чате, но дизайн не утверждён. Это **просмотровый ZIP**, а не разрешение публикации.

          Три варианта caption — короткий, средний (по умолчанию), длинный. Автор выбирает один после просмотра.

          **Контактный лист всех шести слайдов:**

          ![Persona v2 — шесть слайдов](https://github.com/Kizdyan/life-os/releases/download/carousels-v2-baseline/contact-sheet-baseline-pause.png)

          - [Просмотр контактного листа и инструкция](https://github.com/Kizdyan/life-os/blob/main/docs/persona-baseline-v2-review.md)
          - [Проверочный чек-лист](https://github.com/Kizdyan/life-os/blob/main/docs/carousel-acceptance-checklist.md)
          - [Три варианта подписи](https://github.com/Kizdyan/life-os/blob/main/config/carousel-baseline-pause-captions.json)

          Остальные три карусели **не входят** в этот выпуск. Исторический Release carousels-v1 не изменялся. Instagram ничего не публикует автоматически.
          NOTES
          gh release create "$TAG" dist/baseline-review-v2/*.png dist/baseline-review-v2/*.zip \
            --title "Persona Carousels v2 — артистическая карусель №1 (просмотр)" \
            --notes-file /tmp/persona-v2-notes.md \
            --target "$GITHUB_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          RELEASE_JSON="$RELEASE_JSON" node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const release=JSON.parse(process.env.RELEASE_JSON||'{}');
          const manifest=JSON.parse(readFileSync('dist/baseline-review-v2/review-metadata.json','utf8'));
          if(release.tag_name!=='carousels-v2-baseline'||manifest.designApproved!==false)
           throw Error('Wrong Release or visual approval improperly set');
          const expected=manifest.files.slice().sort();
          const assets=(release.assets||[]).map(x=>x.name).sort();
          if(release.assets?.length!==8||JSON.stringify(assets)!==JSON.stringify(expected)||
             release.assets.some(a=>a.size<2000||!a.browser_download_url))
           throw Error('Expected exactly one ZIP, six slide PNG and one contact sheet');
          console.log('PERSONA_V2_GITHUB_RELEASE_VERIFIED '+JSON.stringify({
           url:release.html_url,assets:release.assets.map(x=>({name:x.name,size:x.size,url:x.browser_download_url}))
          }));
          NODE
