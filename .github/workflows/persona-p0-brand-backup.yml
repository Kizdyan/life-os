name: Persona P0 Public Brand and Backup Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "tools/persona-p0-public-backup-browser-e2e.mjs"
      - "tools/persona-reference-workflows-browser-e2e.mjs"
      - "tools/persona-script-draft.mjs"
      - "tools/persona-script-draft.test.mjs"
      - ".github/workflows/persona-p0-brand-backup.yml"
jobs:
  p0-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local Ollama contract and safety regression
        run: node --test tools/persona-script-draft.test.mjs
      - name: Install app and Chromium only (no FFmpeg needed for P0)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start isolated localhost Vite web app
        run: |
          nohup npm run web:dev -- --host 127.0.0.1 --port 4173 > /tmp/persona-p0-vite.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/persona-p0-vite.log
          exit 1
      - name: Verify public PNG pixels, clean copy and full IndexedDB ZIP restore
        run: node tools/persona-p0-public-backup-browser-e2e.mjs
      - name: Verify 5 video lessons, persistent research, batch and Trial Reels in Chromium
        run: node tools/persona-reference-workflows-browser-e2e.mjs
      - name: Retain five-video integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-five-reference-workflows
          path: artifacts/persona-reference-workflows/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain public export and restored ZIP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-p0-public-backup-browser
          path: artifacts/persona-p0-brand-backup/
          retention-days: 14
          if-no-files-found: warn
