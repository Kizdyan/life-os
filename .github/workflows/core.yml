name: core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "api/**"
      - "packages/**"
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "apps/**"
      - "api/**"
      - "packages/**"
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/core.yml"
# Only the latest commit of each PR needs the expensive typecheck/test result.
concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Install FFmpeg and FFprobe for real video and audio integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Persona P3 coverage, moments, economics and B-roll regression tests
        run: |
          python -m unittest discover -s tools -p 'test_p3_modules.py' -v
          PERSONA_PYTHON=python node --test tools/persona-intercut-planner.test.mjs tools/persona-p3-adapter.test.mjs tools/persona-p3-production.test.mjs
      - name: Seven-element strategy validation and mocked LLM contract
        run: |
          node --test tools/persona-strategy.test.mjs
          python -m unittest discover -s tools -p 'test_strategy_analyzer.py' -v
      - name: ProductionJob persistence and restart regression tests
        run: node --test tools/persona-production-recovery.test.mjs
      - name: Persona demo project seeding and persistence regression
        run: node --test tools/seed-persona-demo.test.mjs
      - name: Seed ten file-backed Architect ProductionJobs and verify persistence
        run: |
          node --test tools/seed_10_projects.test.mjs
          node tools/seed_10_projects.mjs --output-root "${RUNNER_TEMP}/persona-architect-10"
          tar -czf "${RUNNER_TEMP}/persona-architect-10-jobs.tar.gz" -C "${RUNNER_TEMP}" persona-architect-10
      - name: Upload reproducible ten-job seeded data
        uses: actions/upload-artifact@v4
        with:
          name: persona-architect-ten-production-jobs
          path: ${{ runner.temp }}/persona-architect-10-jobs.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Persona calendar and distribution regression tests
        run: |
          set -o pipefail
          npm run persona:core:test 2>&1 | tee /tmp/persona-ci-core.log
      - name: Verify full Persona media pipeline with real FFmpeg
        run: |
          set -o pipefail
          npm run media:test 2>&1 | tee /tmp/persona-ci-media.log
      - name: Persona scenario and delivery regression gate
        run: |
          set -o pipefail
          npm run persona:scenario:delivery:test 2>&1 | tee /tmp/persona-ci-scenario-delivery.log
      - name: Run tests with captured diagnostics
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/persona-ci-test.log
      - name: Typecheck with captured diagnostics
        if: success()
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/persona-ci-typecheck.log
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-failure-diagnostics
          path: |
            /tmp/persona-ci-core.log
            /tmp/persona-ci-media.log
            /tmp/persona-ci-scenario-delivery.log
            /tmp/persona-ci-test.log
            /tmp/persona-ci-typecheck.log
          if-no-files-found: warn
