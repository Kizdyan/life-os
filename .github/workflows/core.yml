name: core
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "api/**"
      - "packages/**"
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "apps/**"
      - "api/**"
      - "packages/**"
      - "src/**"
      - "supabase/**"
      - "scripts/**"
      - "tools/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/core.yml"
# Only the latest commit of each PR needs the expensive typecheck/test result.
concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Persona calendar and distribution regression tests
        run: |
          set -o pipefail
          npm run persona:core:test 2>&1 | tee /tmp/persona-ci-core.log
      - name: Verify full Persona media pipeline with real FFmpeg
        run: |
          set -o pipefail
          npm run media:test 2>&1 | tee /tmp/persona-ci-media.log
      - name: Run tests with captured diagnostics
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/persona-ci-test.log
      - name: Typecheck with captured diagnostics
        if: success()
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/persona-ci-typecheck.log
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-failure-diagnostics
          path: |
            /tmp/persona-ci-core.log
            /tmp/persona-ci-media.log
            /tmp/persona-ci-test.log
            /tmp/persona-ci-typecheck.log
          if-no-files-found: warn
