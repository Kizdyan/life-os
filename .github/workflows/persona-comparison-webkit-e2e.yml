name: Persona Comparison Studio WebKit mobile E2E
on:
  pull_request:
    paths:
      - "apps/web/src/PersonaColorComparisonStudio.tsx"
      - "apps/web/src/personaColorComparison.ts"
      - "apps/web/src/PersonaFactory.tsx"
      - "apps/web/src/personaProjectStore.ts"
      - "apps/web/src/persona-color-comparison.css"
      - "tools/persona-color-variants.mjs"
      - "tools/persona-comparison-browser-e2e.mjs"
      - ".github/workflows/persona-comparison-webkit-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persona-comparison-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository and pinned browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.56.1
      - name: Install Playwright WebKit and system video codecs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes playwright@1.56.1 install --with-deps webkit
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Start Persona UI on localhost (HTTPS-equivalent secure context)
        shell: bash
        run: |
          set -euo pipefail
          (npm run web:dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/persona-webkit-vite.log 2>&1 &)
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/persona-webkit-vite.log; exit 1; fi
      - name: Real WebKit mobile FFmpeg MP4 acceptance
        env:
          E2E_BROWSER: webkit
          E2E_URL: http://127.0.0.1:4173
          E2E_ARTIFACTS: /tmp/persona-comparison-webkit-e2e
        run: node tools/persona-comparison-browser-e2e.mjs
      - name: Upload WebKit screenshots, report and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-comparison-webkit-mobile-e2e
          path: |
            /tmp/persona-comparison-webkit-e2e/
            /tmp/persona-webkit-vite.log
          if-no-files-found: warn
