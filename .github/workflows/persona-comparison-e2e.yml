name: Persona Comparison Studio Chrome E2E
on:
  pull_request:
    paths:
      - "apps/web/src/PersonaColorComparisonStudio.tsx"
      - "apps/web/src/personaColorComparison.ts"
      - "apps/web/src/PersonaFactory.tsx"
      - "apps/web/src/personaProjectStore.ts"
      - "apps/web/src/persona-color-comparison.css"
      - "tools/persona-color-variants.mjs"
      - "tools/persona-comparison-browser-e2e.mjs"
      - ".github/workflows/persona-comparison-e2e.yml"
  workflow_dispatch:

concurrency:
  group: persona-comparison-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated browser automation dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.56.1
      - name: Verify Chrome and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v google-chrome
          command -v ffmpeg
          command -v ffprobe
      - name: Start Persona web UI
        shell: bash
        run: |
          set -euo pipefail
          (npm run web:dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/persona-vite-e2e.log 2>&1 &)
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/persona-vite-e2e.log; exit 1; fi
      - name: Real Chrome / FFmpeg Comparison Studio acceptance
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_URL: http://127.0.0.1:4173
          E2E_ARTIFACTS: /tmp/persona-comparison-e2e
        run: node tools/persona-comparison-browser-e2e.mjs
      - name: Upload browser acceptance evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-comparison-chrome-e2e
          path: |
            /tmp/persona-comparison-e2e/
            /tmp/persona-vite-e2e.log
          if-no-files-found: warn
