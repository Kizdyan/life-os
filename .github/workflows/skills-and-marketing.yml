name: skills-and-marketing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "scripts/validate-workflow-skills.mjs"
      - "tools/persona-marketing-audit*.mjs"
      - "package.json"
      - ".github/workflows/skills-and-marketing.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate workflow skills
        run: node scripts/validate-workflow-skills.mjs
      - name: Test marketing calculations and report generation
        run: node --test tools/persona-marketing-audit.test.mjs
