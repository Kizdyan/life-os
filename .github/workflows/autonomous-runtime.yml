name: autonomous-runtime
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [recovery/iphone-static-supabase]
    paths:
      - 'scripts/autonomous-runtime.mjs'
      - '.autonomous/**'
      - '.github/workflows/autonomous-runtime.yml'
jobs:
  watchdog:
    concurrency:
      group: life-os-autonomous-runtime
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/iphone-static-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: PLAN IMPLEMENT TEST PRODUCT-QA CRITIQUE
        run: node scripts/autonomous-runtime.mjs
      - name: Persist supervisor state
        if: always()
        run: |
          git config user.name life-os-watchdog
          git config user.email actions@users.noreply.github.com
          git add .autonomous/runtime-state.json
          git diff --cached --quiet || git commit -m "chore(runtime): persist autonomous watchdog state"
          git push origin HEAD:recovery/iphone-static-supabase
      - name: Durable run log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="PASS"; [ "${{ job.status }}" = "success" ] || status="FAIL"
          gh issue comment 86 --body "AUTONOMOUS_RUNTIME $status | run ${{ github.run_id }} | branch recovery/iphone-static-supabase | physical Phase 2 acceptance remains PENDING/HUMAN_ACCEPTANCE and does not block independent queue."
