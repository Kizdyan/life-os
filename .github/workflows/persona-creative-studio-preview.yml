name: Persona Creative Studio Visual QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "tools/persona-creative-studio-screenshots.mjs"
      - "tools/persona-architect-browser-e2e.mjs"
      - "tools/persona-industry-browser-e2e.mjs"
      - "tools/persona-quick-browser-e2e.mjs"
      - ".github/workflows/persona-creative-studio-preview.yml"
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and pinned Playwright for screenshots
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Install FFmpeg for real one-click MP4 integration
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "Using FFmpeg and FFprobe already installed on the GitHub runner"
          fi
      - name: Assign per-run Worker port for isolated Chromium tests
        run: |
          # Do not reuse 47832 across concurrently scheduled Persona workflows.
          # Both browser UI and local test Worker must receive the identical port.
          worker_port=$(( 50000 + (GITHUB_RUN_ID % 10000) ))
          echo "PERSONA_CI_WORKER_PORT=$worker_port" >> "$GITHUB_ENV"
          echo "VITE_PERSONA_WORKER_PORT=$worker_port" >> "$GITHUB_ENV"
      - name: Start isolated localhost Vite server
        run: |
          nohup npm run web:dev -- --host 127.0.0.1 --port 4173 > /tmp/persona-creative-vite.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/persona-creative-vite.log
          exit 1
      - name: Take real screenshots and verify fixed footer
        run: node tools/persona-creative-studio-screenshots.mjs
      - name: Verify real-browser demo project creation and navigation
        run: node tools/persona-demo-browser-e2e.mjs
      - name: Verify ten Architect project cards in real browser
        run: node tools/persona-architect-browser-e2e.mjs
      - name: Verify industry portfolios and real A4 PDF with browser
        run: node tools/persona-industry-browser-e2e.mjs
      - name: Verify all 10 seeded waiting carousels in real Chromium (desktop and mobile)
        run: node tools/persona-carousel-browser-e2e.mjs
      - name: Verify sourced research intake, author fact review and real PNG ZIP in mobile Chromium
        run: node tools/persona-research-carousel-browser-e2e.mjs
      - name: Upload research carousel browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-research-carousel-mobile-evidence
          path: artifacts/persona-research-browser/
          if-no-files-found: warn
      - name: Produce the real sourced fridge-hum draft without author approval
        run: node tools/persona-production-carousel-browser-e2e.mjs
      - name: Upload seven-slide production draft for author review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-fridge-hum-production-draft
          path: artifacts/persona-production-carousel/
          retention-days: 30
          if-no-files-found: error
      - name: Verify unified content calendar opens real Reels and photo jobs in Chromium
        run: node tools/persona-weekly-calendar-browser-e2e.mjs
      - name: Verify real one-click browser-to-MP4 workflow
        run: node tools/persona-quick-browser-e2e.mjs
      - name: Upload weekly calendar screenshots and navigation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-weekly-calendar-browser
          path: artifacts/persona-weekly-calendar/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload carousel 10-card screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-carousel-seed-dashboard
          path: artifacts/persona-carousel-seed/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload one-click real browser screenshots and MP4 fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-one-click-auto-render
          path: artifacts/persona-one-click/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload actor and Music Sync portfolio screenshots/PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-industry-portfolios
          path: artifacts/persona-industry-portfolios/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload ten-card dashboard and storyboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-architect-ten-cards-screenshots
          path: artifacts/persona-architect-10/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload demo dashboard and storyboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-demo-project-screenshots
          path: artifacts/persona-demo/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload 390px and 1440px screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-creative-studio-screenshots
          path: artifacts/persona-creative-studio/
          retention-days: 14
          if-no-files-found: warn
