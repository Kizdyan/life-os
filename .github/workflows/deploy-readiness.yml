name: deploy-readiness

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "api/**"
      - "supabase/functions/life-os-runtime/**"
      - "packages/core/src/yandex-oauth.ts"
      - "scripts/api-smoke.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/deploy-readiness.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "api/**"
      - "packages/core/src/yandex-oauth.ts"
      - "scripts/api-smoke.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "package.json"

jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run api:typecheck
      - run: npm run api:smoke
      - name: Build production static frontend
        env:
          VITE_LIFE_OS_REMOTE_ENABLED: "true"
          VITE_LIFE_OS_EDGE_RUNTIME_URL: https://zhehdbhpkcucgcjwuhxm.supabase.co/functions/v1/life-os-runtime
        run: npm run web:build
      - name: Verify production bundle is Edge-only
        run: |
          grep -R -q 'zhehdbhpkcucgcjwuhxm.supabase.co/functions/v1/life-os-runtime' dist/assets
          if grep -R -E -q '/api/(persona|runtime/(sync|session))' dist/assets; then
            echo 'Forbidden Vercel runtime route found in production bundle'
            exit 1
          fi
      - name: Verify deploy artifact
        run: test -f dist/index.html
      - name: Verify Supabase Edge recovery path
        if: github.head_ref == 'recovery/iphone-static-supabase'
        env:
          EDGE_URL: https://zhehdbhpkcucgcjwuhxm.supabase.co/functions/v1/life-os-runtime
        run: |
          health="$(curl --fail --silent --show-error "$EDGE_URL?health=1")"
          node -e 'const h=JSON.parse(process.argv[1]); if(h.configured!==true||h.databaseReachable!==true) process.exit(1)' "$health"
          curl --fail --silent --show-error -D /tmp/edge-headers -o /dev/null -X OPTIONS "$EDGE_URL" \
            -H 'Origin: https://life-os-iphone-preview.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type'
          tr -d '\r' < /tmp/edge-headers > /tmp/edge-headers-normalized
          grep -qi '^access-control-allow-origin: \*$' /tmp/edge-headers-normalized
          grep -qi '^access-control-allow-methods: .*POST.*OPTIONS' /tmp/edge-headers-normalized
