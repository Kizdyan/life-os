name: deploy-readiness

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "api/**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-readiness.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "api/**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"

jobs:
  preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run api:typecheck
      - run: npm run web:typecheck
      - run: npm run web:build
      - name: Verify deploy artifact
        run: test -f apps/web/dist/index.html
