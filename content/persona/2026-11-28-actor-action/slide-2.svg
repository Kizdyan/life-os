<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F1E8D6"/><path d="M72 132H1008M72 1230H1008" stroke="#191C1D" stroke-opacity=".35" stroke-width="2"/><text x="74" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#191C1D" letter-spacing="3">АКТЁРСКАЯ ПРАКТИКА</text><text x="74" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#191C1D" letter-spacing="2">КОНСТАНТИН УМРИХИН</text><text x="906" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#191C1D" >02 / 05</text><text x="72" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#B45135" letter-spacing="2">01  /  ОБВИНИТЬ</text><text x="72" y="386" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#191C1D" >«Я тебя</text><text x="72" y="506" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#191C1D" >ждал».</text><path d="M85 660H910L858 620M910 660L858 700" fill="none" stroke="#B45135" stroke-width="10"/><circle cx="85" cy="660" r="15" fill="#B45135"/><text x="72" y="853" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="400" fill="#191C1D" >Партнёр опоздал.</text><text x="72" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="400" fill="#191C1D" >Нужно добиться признания:</text><text x="72" y="1047" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#B45135" >«Ты понимаешь,</text><text x="72" y="1112" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#B45135" >что сделал?»</text></svg>