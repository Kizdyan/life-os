<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#191C1D"/><path d="M72 132H1008M72 1230H1008" stroke="#F1E8D6" stroke-opacity=".35" stroke-width="2"/><text x="74" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#F1E8D6" letter-spacing="3">АКТЁРСКАЯ ПРАКТИКА</text><text x="74" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#F1E8D6" letter-spacing="2">КОНСТАНТИН УМРИХИН</text><text x="906" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#F1E8D6" >03 / 05</text><text x="72" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#DA8267" letter-spacing="2">02  /  УДЕРЖАТЬ</text><text x="72" y="386" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#F1E8D6" >«Я тебя</text><text x="72" y="506" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#F1E8D6" >ждал».</text><path d="M85 660C270 510 550 510 760 660C850 735 930 735 995 660" fill="none" stroke="#DA8267" stroke-width="7"/><circle cx="85" cy="660" r="15" fill="#DA8267"/><circle cx="995" cy="660" r="15" fill="#DA8267"/><text x="72" y="853" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="400" fill="#F1E8D6" >Партнёр собирается уйти.</text><text x="72" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="400" fill="#F1E8D6" >Нужно, чтобы он остался:</text><text x="72" y="1047" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#DA8267" >«Не уходи.</text><text x="72" y="1112" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#DA8267" >Побудь ещё немного».</text></svg>