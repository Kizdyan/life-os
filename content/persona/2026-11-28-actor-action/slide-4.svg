<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#F1E8D6"/><path d="M72 132H1008M72 1230H1008" stroke="#191C1D" stroke-opacity=".35" stroke-width="2"/><text x="74" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#191C1D" letter-spacing="3">АКТЁРСКАЯ ПРАКТИКА</text><text x="74" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#191C1D" letter-spacing="2">КОНСТАНТИН УМРИХИН</text><text x="906" y="1284" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#191C1D" >04 / 05</text><text x="72" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#B45135" letter-spacing="1">03  /  СКРЫТЬ ТРЕВОГУ</text><text x="72" y="386" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#191C1D" >«Я тебя</text><text x="72" y="506" font-family="DejaVu Serif, Georgia, serif" font-size="105" font-weight="400" fill="#191C1D" >ждал».</text><path d="M85 660H350L390 625L430 695L475 625L520 660H995" fill="none" stroke="#B45135" stroke-width="7"/><rect x="351" y="605" width="200" height="108" fill="#F1E8D6" opacity=".83" stroke="#B45135" stroke-width="2" stroke-dasharray="8 8"/><text x="72" y="853" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="400" fill="#191C1D" >Партнёр не знает,</text><text x="72" y="923" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="400" fill="#191C1D" >насколько ты испугался.</text><text x="72" y="1047" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#B45135" >«Пусть думает,</text><text x="72" y="1112" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="700" fill="#B45135" >что всё в порядке».</text></svg>